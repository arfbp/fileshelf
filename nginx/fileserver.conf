# ==============================================================================
# FileShelf - Nginx High-Performance File Server Configuration
# ==============================================================================
# Optimized for high-throughput distribution of installers and large packages
# (.exe, .msi, .dmg, .pkg, .deb, .rpm, .zip, .tar.gz, .iso).
#
# Features:
# - Full HTTP Range Request support for download managers (aria2, curl, wget)
# - Kernel zero-copy file transmission via sendfile & tcp_nopush
# - Static manifest caching with instant revalidation
# - Hardened security headers (read-only enforcement)
# - Optional Basic Auth / IP allowlist for Admin route
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fileserver.example.com;

    # Root directory for static frontend files
    root /var/www/fileserver;
    index index.html;

    # --------------------------------------------------------------------------
    # Global Performance Tuning
    # --------------------------------------------------------------------------
    # Use Linux sendfile syscall to transmit files directly between disk and
    # socket without context-switching into user space (Zero-Copy)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Fast client timeouts for high-throughput concurrency
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # Open file descriptor cache for frequently accessed static files
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --------------------------------------------------------------------------
    # Security Headers (Public Read-Only Security Model)
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow CORS if needed for external scripts or CLI tools
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Accept-Ranges, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # --------------------------------------------------------------------------
    # Public Read-Only Downloads (/upload/*)
    # --------------------------------------------------------------------------
    # Serves installer packages directly from disk.
    # Completely read-only: POST, PUT, DELETE, PATCH are strictly forbidden.
    location /upload/ {
        alias /var/www/fileserver/upload/;
        
        # Enforce Read-Only Methods
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        # Enable native HTTP Range requests (206 Partial Content)
        # Nginx automatically enables Accept-Ranges: bytes for static files
        max_ranges 512;

        # Disable output buffering for large downloads to conserve memory
        output_buffers 1 512k;
        aio threads;
        directio 16m;

        # Force browser download instead of rendering for installer files
        types {
            application/octet-stream exe msi dmg pkg deb rpm iso img 7z;
            application/zip zip;
            application/gzip gz;
            application/x-tar tar;
            application/json json;
        }

        # Cache manifest json with short TTL / revalidation
        location = /upload/index.json {
            expires 30s;
            add_header Cache-Control "public, no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Cache large static binaries with immutable cache policy
        location ~* \.(exe|msi|dmg|pkg|deb|rpm|zip|tar\.gz|iso|7z)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header Content-Disposition "attachment" always;
            add_header Accept-Ranges "bytes" always;
        }
    }

    # --------------------------------------------------------------------------
    # Admin Interface (/admin)
    # --------------------------------------------------------------------------
    # Optional authentication guard for administrative control
    location /admin {
        try_files $uri $uri/ /index.html;

        # Uncomment to enable HTTP Basic Authentication for admin access:
        # auth_basic "FileShelf Repository Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd_fileserver;

        # Uncomment to restrict admin access by IP address:
        # allow 192.168.1.0/24;
        # allow 10.0.0.0/8;
        # deny all;
    }

    # --------------------------------------------------------------------------
    # Static Assets & SPA Routing
    # --------------------------------------------------------------------------
    location /assets/ {
        alias /var/www/fileserver/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
